name: AutoSE exact-head CI
'on':
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  tinydb-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: trusted
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build trusted image
      run: docker build -t autose-pytest:trusted -f trusted/workflow/Dockerfile trusted/workflow
    - name: Test exact PR head in isolated container
      env:
        PYTHONPATH: trusted/workflow
      run: python trusted/workflow/ci_exact.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: exact-head-test-evidence-attempt-${{ github.run_attempt }}
        path: ci-output/
        retention-days: 90
