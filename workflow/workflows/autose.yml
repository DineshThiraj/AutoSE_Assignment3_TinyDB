    needs:
    - r2a2_impl
    - r2a2_build
    - r2a2_author
    - r2a2_tests
    - admission
    if: always() && needs.r2a2_impl.result == 'success'
    uses: ./.github/workflows/autose-data.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: select
      prefix: r2a2_result
      prior: r2a2_*
      base_sha: ${{ needs.admission.outputs.base_sha }}
