    if: always() && needs.r2_done.result == 'success' && needs.r2_done.outputs.passed == 'true'
    uses: ./.github/workflows/autose-publish.yml
    permissions:
      contents: write
      actions: read
      pull-requests: write
    with:
      phase: release
      prefix: r2_release
      prior: r2_done
      base_sha: ${{ needs.admission.outputs.base_sha }}
  r2_review:
    needs:
    - r2_release
    - admission
    if: always() && needs.r2_release.result == 'success' && needs.r2_release.outputs.ready == 'true'
    uses: ./.github/workflows/autose-broker.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: review
      prefix: r2_review
      prior: r2_release
      base_sha: ${{ needs.admission.outputs.base_sha }}
    secrets:
      AUTOSE_MODEL_API_KEY: ${{ secrets.AUTOSE_MODEL_API_KEY }}
  r2_review_tests:
    needs:
    - r2_review
    - admission
    if: always() && needs.r2_review.result == 'success' && needs.r2_review.outputs.ready == 'true'
    uses: ./.github/workflows/autose-execute.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: review-tests
      prefix: r2_review_tests
      prior: r2_review
      base_sha: ${{ needs.admission.outputs.base_sha }}
  r2_review_final:
    needs:
    - r2_review_tests
    - admission
    if: always() && needs.r2_review_tests.result == 'success' && needs.r2_review_tests.outputs.ready == 'true'
    uses: ./.github/workflows/autose-broker.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: review-final
      prefix: r2_review_final
      prior: r2_review_tests
      base_sha: ${{ needs.admission.outputs.base_sha }}
    secrets:
      AUTOSE_MODEL_API_KEY: ${{ secrets.AUTOSE_MODEL_API_KEY }}
  r2_post:
    needs:
    - r2_review_final
    - admission
    if: always() && needs.r2_review_final.result == 'success' && needs.r2_review_final.outputs.ready == 'true'
    uses: ./.github/workflows/autose-publish.yml
    permissions:
      contents: write
      actions: read
      pull-requests: write
    with:
      phase: post-review
      prefix: r2_post
      prior: r2_review_final
      base_sha: ${{ needs.admission.outputs.base_sha }}
  final_evidence:
    needs:
    - admission
    - r1_requirements
    - r1_design
    - r1a1_impl
    - r1a1_build
    - r1a1_author
    - r1a1_tests
    - r1a1_result
    - r1a2_start
    - r1a2_impl
    - r1a2_build
    - r1a2_author
    - r1a2_tests
    - r1a2_result
    - r1_done
    - r1_release
    - r1_review
    - r1_review_tests
    - r1_review_final
    - r1_post
    - r2_start
    - r2_requirements
    - r2_design
    - r2a1_impl
    - r2a1_build
    - r2a1_author
    - r2a1_tests
    - r2a1_result
    - r2a2_start
    - r2a2_impl
    - r2a2_build
    - r2a2_author
    - r2a2_tests
    - r2a2_result
    - r2_done
    - r2_release
    - r2_review
    - r2_review_tests
    - r2_review_final
    - r2_post
    if: always() && needs.admission.result == 'success'
    uses: ./.github/workflows/autose-data.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: final
      prefix: final_evidence
      prior: '*'
      base_sha: ${{ needs.admission.outputs.base_sha }}
