    needs:
    - r2a1_result
    - r2a2_result
    - admission
    if: always() && needs.r2a1_result.result == 'success'
    uses: ./.github/workflows/autose-data.yml
    permissions:
      contents: read
      actions: read
    with:
      phase: select
      prefix: r2_done
      prior: r2a*_result
      base_sha: ${{ needs.admission.outputs.base_sha }}
